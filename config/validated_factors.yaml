extends: default.yaml
data:
  source: parquet_futures
  cache:
    enabled: false
# Frozen validation evidence window; not the current production end date.
date_range:
  start: '2025-01-01'
  end: '2026-05-31'
universe:
- A
- AG
- AL
- AU
- CU
- FU
- HC
- I
- IC
- IF
- IH
- J
- JM
- M
- MA
- NI
- P
- RB
- RM
- RU
- SA
- SN
- SR
- T
- TA
- TL
- TS
- Y
- ZN
- IM
- TF
- CF
- OI
- LH
- JD
- SC
- V
- UR
universe_selection:
  enabled: false
processing:
- type: winsorize
  params:
    method: mad
    n_sigma: 3
- type: standardize
  params:
    method: zscore
    by_date: true
# 固定10f观察基线；该列表不是交易批准，也不代表修复后绩效已达生产门槛。
factors:
- intraday_price_peak_count_20d
- intraday_realised_skewness_20d
- intraday_drip_stone_20d
- intraday_peak_ridge_ratio_20d
- intraday_torrent_down_20d
- intraday_lowest_time_20d
- intraday_term_slope_20d
- intraday_open_close_volume_ratio_20d
- intraday_turnover_velocity_20d
- intraday_price_delay_20d
validated_candidates:
# 2026-08-20全历史层级FDR后、|corr|>=0.5簇内择优的观察候选。
# 全部仍等待方向预声明后的新OOS，不能自动写入上方factors或发布目标权重。
- intraday_basis_momentum_20d
- intraday_price_peak_count_20d
- intraday_torrent_up_20d
- intraday_support_test_20d
- intraday_upper_wick_ratio_20d
- intraday_path_bandwidth_20d
- intraday_term_spread_vol_20d
- intraday_overconfidence_intensity_20d
- intraday_wick_symmetry_20d
- intraday_volume_vol_20d
- intraday_sector_sync_20d
- intraday_residual_skew_20d
- intraday_tail_ratio_20d
