extends: default.yaml

data:
  source: parquet_futures
  cache:
    enabled: false

# Frozen narrow smoke-test window.
date_range:
  start: '2025-01-01'
  end: '2026-05-31'

universe_selection:
  enabled: false

# Minimal processing for narrow time window
processing:
  - type: winsorize
    params: {method: mad, n_sigma: 3}
  - type: standardize
    params: {method: zscore, by_date: true}
