# No-argument entrypoint remains weights only. The dated auto command is opt-in.
schema_version: 1
mode: simulation
catalog: config/strategy_library.yaml
strategy_ids: {formal_main: '@formal'}
output_root: runs/trading
rounding: half_up
accounts:
  paper_500w:
    equity: 5000000
    available: 5000000
    margin_used: 0
    frozen_margin: 0
    reserve: 100000
    max_margin_ratio: 0.70
    max_gross_exposure: 2.10
    max_abs_net_exposure: 0.10
    require_one_lot: true  # Each strategy's selected legs need >= 1 lot BEFORE rounding.
routes:
  - strategy_id: formal_main
    account_id: paper_500w
    # Initial/minimum sizing: normalize all selected legs together, then round.
    # For a fixed daily scale, use capital_basis: reference and amount from
    # route_sizing.csv's reference_capital; remove units. Never alter account equity.
    capital_basis: complete_unit
    units: 1
execution:
  paper_500w:
    channel: manual
    expected_identity: paper_500w
    execute_enabled: false
    cold_start: require_flat
    managed_roots: [A, AG, AL, AU, CU, FU, HC, I, IC, IF, IH, J, JM, M, MA, NI, P, RB, RM, RU, SA, SN, SR, T, TA, TL, TS, Y, ZN, IM, TF, CF, OI, LH, JD, SC, V, UR]
    max_snapshot_age_seconds: 60
    plan_ttl_seconds: 120
    max_order_lots: 100
    order_type: market
    max_price_deviation: 0.05
    limit_prices: {}
    # For next-day/night trading, set the expected preceding completed close
    # explicitly; never assume a weekend/holiday calendar from business weekdays.
    # expected_signal_date: '2026-09-15'
automation:
  enabled: false
  preview_only_dates: []  # Explicit dated rehearsals cannot start an execution session.
  contest_execution_verified: false
  calendar_path: config/trading_calendar_2026.json
  sdk_python: ''  # Dedicated Panda SDK interpreter, configured locally.
  specs_path: config/trading_specs.local.json
  prepare_at: '09:00:00'
  retry_prepare_at: ['13:00:00', '14:00:00']
  freeze_at: '14:30:00'
  preflight_at: '14:45:00'
  start_at: '14:55:00'
  submit_until: '14:56:00'
  completion_by: '14:58:00'
  preparation_timeout_seconds: 3600
  query_timeout_seconds: 60
  poll_interval_seconds: 2
  max_attempts_per_leg: 3
