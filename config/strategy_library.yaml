strategies:
  # The two effective-library IDs and YAML filenames retain their historical
  # ``_ridge`` suffix for run/artifact compatibility; display names and
  # portfolio semantics are factor-set based, not Ridge-owned.
  # Effective-library example fields: id, status=preferred|observing|archived,
  # source=effective_library, factor_set_id, config_path and mode=single|multi.
  # Existing fixed 10f definition is retained only as a parallel observation.
  # Its IDE comparison route uses config/default.yaml::production_portfolio
  # (ICIR + Top10/Bottom10 + cap3 + ERC), not the generic model/risk pipeline.
  # It does not claim membership in the effective-factor subset catalog.
  - id: current_single_baseline
    status: observing
    source: legacy_observation
    factor_set_id: ''
    config_path: config/default.yaml
    mode: single
    description: Fixed 10f observation baseline using the default production recipe; not production approved.
  - id: intraday_balanced_ridge
    status: observing
    source: effective_library
    factor_set_id: intraday_balanced_core
    config_path: config/strategy_intraday_balanced_ridge.yaml
    mode: multi
    description: 平衡有效因子子集；默认生产方法基线，周期匹配固定为5/10/20。
  - id: intraday_compact_ridge
    status: observing
    source: effective_library
    factor_set_id: intraday_compact_core
    config_path: config/strategy_intraday_compact_ridge.yaml
    mode: multi
    description: 紧凑有效因子子集；默认生产方法基线，周期匹配固定为5/10/20。
  # Archived snapshot definitions are excluded from ordinary comparisons.
  # Select them only through RUN_AND_COMPARE_SNAPSHOT_AUDIT; the current
  # default recipe is then applied to the frozen factor set.
  - id: snapshot_6f_icir
    status: archived
    source: legacy_observation
    factor_set_id: ''
    factor_definition_path: snapshot/6f_icir/combined.py
    config_path: config/default.yaml
    mode: single
    description: 历史6f ICIR因子集；仅允许通过快照审计分支按当前方法重评。
  - id: snapshot_8f_icir
    status: archived
    source: legacy_observation
    factor_set_id: ''
    factor_definition_path: snapshot/8f_icir/combined.py
    config_path: config/default.yaml
    mode: single
    description: 历史8f ICIR因子集；仅允许通过快照审计分支按当前方法重评。
  - id: snapshot_13f_icir
    status: archived
    source: legacy_observation
    factor_set_id: ''
    factor_definition_path: snapshot/13f_icir/combined.py
    config_path: config/default.yaml
    mode: single
    description: 历史13f ICIR因子集；仅允许通过快照审计分支按当前方法重评。
