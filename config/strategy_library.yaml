# Parallel factor subsets and strategies. This is the human-readable catalog;
# module parameters remain in FrameworkConfig YAMLs. Effective subsets sharing
# config/default.yaml bind their members from factor_sets in memory.
schema_version: 1
effective_factor_library: ./factor_library/library.json
output_root: ./runs/portfolio_backtest
plot: true

# Add reusable effective-library subsets here. They are peers, not rankings.
# selection_context records why the subset exists; it is evidence metadata and
# never silently changes leverage, universe, risk, or weighting parameters.
# Example:
#   - id: metals_balanced
#     status: active
#     description: Factors retained for a metals-focused constrained portfolio.
#     factors: [factor_a, factor_b]
#     selection_context: {purpose: metals, max_instruments: 8, leverage: low}
