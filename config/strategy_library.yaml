  # ``_ridge`` suffix for run/artifact compatibility; display names and
  # portfolio semantics are factor-set based, not Ridge-owned.
  # Effective-library example fields: id, status=preferred|observing|archived,
  # source=effective_library, factor_set_id, config_path and mode=single|multi.
  # Existing fixed 10f definition is retained only as a parallel observation.
  # Its IDE comparison route uses config/default.yaml::production_portfolio
  # (ICIR + Top10/Bottom10 + cap3 + ERC), not the generic model/risk pipeline.
  # It does not claim membership in the effective-factor subset catalog.
  - id: current_single_baseline
    name: 量价脉冲
    factor_definition_path: config/factor_sets/legacy_10f.json
    status: observing
    source: legacy_observation
    factor_set_id: ''
    config_path: config/default.yaml
    mode: single
    description: Fixed 10f observation baseline using the default production recipe; not production approved.
