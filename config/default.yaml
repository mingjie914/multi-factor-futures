# Single framework contract for research, screening, backtests and the main strategy.
market: futures
seed: 42

data:
  # Certified DuckDB is the default runtime source. Parquet remains the
  # authoritative publication and rollback layer.
  source: duckdb_futures
  # Only exchange/source-verified market closures belong here. Unknown
  # post-listing close gaps fail closed and must be repaired at the data source.
  audited_nontrading_closes:
    NI:
      - '2022-03-10'
  cache:
    # ParquetFuturesSource owns fingerprinted selected-contract caches. Disable
    # the generic range cache so a source update cannot reuse stale close data.
    enabled: false
    path: ./cache
    backend: parquet
  parquet:
    root_path: '${MF_PARQUET_ROOT:}'
    datasets:
      daily: futureshistoryprices1d
      1min: futureshistoryprices1m
      5min: futureshistoryprices5m
      15min: futureshistoryprices15m
    seat_dataset: futuresseatdata
    dominant_lag_days: 1
    schedule_buffer_days: 45
    # FU was relaunched as bonded 380 CST fuel oil on 2018-07-16.  Earlier FU
    # contracts are a different economic epoch and must not be bridged.
    root_active_from:
      FU: '2018-07-16'
    eager_fields: true
    panel_cache_entries: 1
    curve_cache_enabled: true
    curve_cache_path: './cache/curve_aggregates'
    selected_cache_enabled: true
    selected_cache_path: './cache/selected_contracts'
  # The machine-local path and certified release remain explicit and fail closed.
  duckdb:
    path: '${MF_DUCKDB_PATH:}'
    required_release_id: '${MF_DATA_RELEASE_ID:}'

# One inclusive cutoff governs every factor/strategy selection and validation
# workflow. Rows after it are forward observation only and cannot feed admission.
date_policy:
  research_cutoff: '2026-05-15'

# Observation/backtest range. ``latest_available`` is resolved through the
# selected certified source when a runtime or reporting workflow starts.
date_range:
  start: '2017-01-01'
  end: latest_available

# Structured research library. Consumers must opt in; membership never changes
# strategy factors or publishes targets automatically.
factor_library:
  path: './factor_library/library.json'
  # Legacy baseline below is not an effective-library portfolio. New confirmed
  # strategy configs should set this true to reject unapproved factor periods.
  enforce_portfolio_periods: false

universe:
  - A
  - AG
  - AL
  - AU
  - CU
  - FU
  - HC
  - I
  - IC
  - IF
  - IH
  - J
  - JM
  - M
  - MA
  - NI
  - P
  - RB
  - RM
  - RU
  - SA
  - SN
  - SR
  - T
  - TA
  - TL
  - TS
  - Y
  - ZN
  - IM
  - TF
  - CF
  - OI
  - LH
  - JD
  - SC
  - V
  - UR

# Fixed 10-factor observation baseline. It is not deployment approval.
factors:
  - intraday_price_peak_count_20d
  - intraday_realised_skewness_20d
  - intraday_drip_stone_20d
  - intraday_peak_ridge_ratio_20d
  - intraday_torrent_down_20d
  - intraday_lowest_time_20d
  - intraday_term_slope_20d
  - intraday_open_close_volume_ratio_20d
  - intraday_turnover_velocity_20d
  - intraday_price_delay_20d

processing:
  - type: winsorize
    params: {method: mad, n_sigma: 3}
  - type: standardize
    params: {method: zscore, by_date: true}

testing:
  ic:
    methods: [pearson, spearman]
    decay_periods: [1, 3, 5, 10, 20, 40]
    forward_period: 5
  layered: {n_groups: 3, rebalance: monthly}
  regression: {method: fama_macbeth, weighted: false}

# Ridge is the enabled post-screening estimator. sector_grouped_lasso is a
# registered parallel alternative, but is never selected unless a strategy
# configuration explicitly sets alpha.type to it. Neither model changes the
# effective-factor library. Raw OLS/HAC and multiplicity control happen first.
alpha:
  type: sector_grouped_ridge
  params:
    fit_intercept: true
    min_samples_per_sector: 100
    fallback_to_global: false
    ridge_alphas: [0.01, 0.1, 1.0, 10.0]
    ridge_cv_folds: 3

risk:
  type: barra_futures
  style_factors: [carry, momentum, volatility, skewness, liquidity]
  estimation_window: 252
  covariance_estimator: shrinkage

optimization:
  # Formal path: hierarchical_asset_risk_parity. mean_variance remains a
  # research-only challenger for horizon-matched, calibrated return forecasts.
  type: hierarchical_asset_risk_parity
  risk_aversion: 2.0  # research-only mean_variance
  cost_penalty: 0.5  # research-only utility optimizers
  hierarchical_asset_risk_parity:
    target_volatility: 0.10
    max_leverage: 2.0
    covariance_shrinkage: 0.30
    periods_per_year: 252
    volatility_floor: 0.01
    asset_class_budgets: {}
    commodity_sector_budgets: {}
  dynamic_risk_limits:
    enabled: true
    asset_vol_budget: 0.025
    sector_vol_budget: 0.06
    hard_asset_cap: 1.0
    gross_cap: 2.0
    net_cap: 0.5
    atr_window: 20
    risk_window: 60
    covariance_shrinkage: 0.30
  constraints:
    - {type: net_exposure, lower: -0.5, upper: 0.5}
    - {type: leverage, limit: 2.0, vol_target: 0.0}
    - {type: sector_exposure, limit: 0.3}
    - {type: turnover, limit: 0.30}

costs:
  type: simple_futures
  # Full traded notional pays 2 bp. Post-screen backtests additionally accrue
  # the annual 10.5 bp roll allowance on gross exposure.
  turnover_cost_rate: 0.0002
  annual_fee: 0.0
  annual_roll_cost: 0.00105
  periods_per_year: 252
  cost_stage: post_screen_backtest

# The main framework uses the complete ordered universe above. The selector is
# retained as an explicit research capability but is not a second default pool.
universe_selection:
  enabled: false
  mode: lagged_liquidity_sector_balanced
  lookback: 60
  rebalance_freq: monthly
  target_count: 32
  min_count: 28
  max_count: 35
  min_listing_days: 120
  min_data_coverage: 0.95
  score_weights: {amount: 0.7, oi: 0.3}
  exit_buffer: 4
  sector_minimums:
    ferrous: 4
    nonferrous: 3
    precious: 2
    energy: 5
    agri: 6
    stock_index: 4
    bond: 2
    other: 0
  sector_maximums:
    ferrous: 6
    nonferrous: 5
    precious: 2
    energy: 7
    agri: 8
    stock_index: 4
    bond: 2
    other: 2

# This is a separate post-forecast holding gate and remains disabled.
asset_selection:
  enabled: false
  mode: hysteresis_top_n
  top_n_per_side: 2
  exit_buffer: 1
  min_abs_forecast: 0.0
  restrict_to_valid_sectors: false

# Main branch A. Asset limits are fractions of each unit-gross long/short
# sleeve. ``sector_count_cap`` limits names, not sector weight; optional sector
# weight caps remain empty unless explicitly approved.
production_portfolio:
  factor_weight_method: lw_abs
  ic_window: 60
  top_n_per_side: 10
  sector_count_cap: 3
  asset_weight_method: erc
  asset_min_fraction: 0.005
  asset_max_fraction: 0.20
  asset_max_overrides: {}
  sector_weight_caps: {}
  gross_exposure: 2.0
  risk_lookback_calendar_days: 90
  minimum_risk_observations: 10
  covariance_shrinkage: 0.30

backtest:
  rebalance_freq: weekly
  benchmark: csi300
  plot: true
  report_dir: ./reports
  training_window: 750
  retrain_freq: 10
  holding_period: 5

# Empty horizon templates are populated only from audited training artifacts.
sub_portfolios:
  - name: short_term
    factors: []
    rebalance_freq: weekly
    holding_period: 5
    retrain_freq: 5
    training_window: 750
    capital_weight: 0.34
  - name: mid_term
    factors: []
    rebalance_freq: weekly
    holding_period: 10
    retrain_freq: 10
    training_window: 750
    capital_weight: 0.33
  - name: long_term
    factors: []
    rebalance_freq: weekly
    holding_period: 40
    retrain_freq: 20
    training_window: 750
    capital_weight: 0.33

meta_optimizer:
  enabled: true
  method: shrinkage_min_variance
  reweight_freq: 20
  min_weight: 0.01
  max_weight: 0.60
  target_volatility: 0.10
  estimation_window: 252
  covariance_shrinkage: 0.30
  enforce_underlying_constraints: true
  underlying_constraints: []
  underlying_dynamic_risk_limits:
    enabled: true
    asset_vol_budget: 0.03
    sector_vol_budget: 0.075
    hard_asset_cap: 1.0
    gross_cap: 2.0
    net_cap: 0.5
    atr_window: 20
    risk_window: 60
    covariance_shrinkage: 0.30

factor_synthesis: {enabled: false, confirm_map: []}
research_artifacts: {enabled: false, path: '', strict_config_hash: true}
factor_governance:
  enabled: true
  default_max_per_family: 20
  family_caps:
    trend: 20
    carry: 12
    risk_distribution: 15
    liquidity_flow: 15
    positioning_participation: 12
    intraday: 12
  explicit_family_map: {}

# Formal discovery policy. Horizons and preprocessing variants are hypotheses
# within an economic factor; Bonferroni/FWER is retained as a report label.
validation_policy:
  version: factor_validation_v2
  discovery_method: hierarchical_fdr
  discovery_q: 0.10
  fwer_report_alpha: 0.05
  min_abs_ic: 0.01
  min_abs_t: 2.0
  deployment_hit_rate: 0.52
  deployment_oos_hit_rate: 0.50
  oos_fold_sign_ratio: 0.60
  annual_direction_ratio: 0.60
  annual_effect_ratio: 0.65
  minimum_calendar_years: 5
  intraday_minimum_calendar_years: 1
  minimum_year_observations: 20
  minimum_train_bars_by_frequency:
    daily: 750
    daily_intraday: 63
    1min: 6000
    5min: 2880
    15min: 960
    30min: 480
    hourly: 240
  minimum_test_bars_by_frequency:
    daily: 250
    daily_intraday: 42
    1min: 1000
    5min: 960
    15min: 320
    30min: 160
    hourly: 80
  minimum_train_days_by_frequency:
    daily: 750
    daily_intraday: 63
    1min: 60
    5min: 60
    15min: 60
    30min: 60
    hourly: 60
  minimum_test_days_by_frequency:
    daily: 250
    daily_intraday: 42
    1min: 20
    5min: 20
    15min: 20
    30min: 20
    hourly: 20
  minimum_train_test_ratio: 3.0
  # Walk-forward rolling parameters (bars per frequency).
  # daily_intraday = intraday factors aggregated to daily output.
  wf_train_bars_by_frequency:
    daily: 500
    daily_intraday: 126
    1min: 6000
  wf_test_bars_by_frequency:
    daily: 125
    daily_intraday: 42
    1min: 2000
  wf_step_bars_by_frequency:
    daily: 125
    daily_intraday: 42
    1min: 2000
  # Recent rolling evidence only; long history is reserved for frozen-combination backtests.
  wf_max_folds_by_frequency:
    daily_intraday: 5
  # Warm-up days before IC start, per frequency.
  warmup_days_by_frequency:
    daily: 252
    daily_intraday: 90
    1min: 60
  n_return_groups: 3
  # Diagnostic reference only; turnover is not a cost or admission gate.
  monthly_turnover_reference: 0.50
  cost_safety_margin: 1.50
  single_instrument_min_trading_days: 750
  single_instrument_bootstrap_samples: 399
  observation_weight_cap: 0.50
  require_predeclared_direction_for_promotion: true
  expected_directions: {}
  dual_track_families: [carry, trend, macro_trend]
  family_horizons: {}
  scorecard:
    enabled: true
    enforced: false
    calibrated: false
    calibration_source: ''
    calibration_sha256: ''
    weights:
      annual_direction: 0.25
      annual_effect: 0.25
      hit_rate: 0.25
      ir_stability: 0.25
    ir_std_max: 0.30
    threshold: 0.75
horizon_ensemble:
  enabled: false
  neighbor_count: 1
  max_log_distance: 0.80
  use_valid_periods: false
  retrain_freq_by_horizon: {}
